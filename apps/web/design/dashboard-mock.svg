<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f8fb"/>
      <stop offset="100%" stop-color="#f3f6ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="90" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0f172a">AI Visibility Dashboard</text>
  <text x="80" y="120" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Aggregate brand intelligence across AI responses</text>

  <!-- Stats Row -->
  <g filter="url(#shadow)">
    <rect x="80" y="150" width="340" height="110" rx="20" fill="url(#card)" stroke="#e5e7eb"/>
    <rect x="450" y="150" width="340" height="110" rx="20" fill="url(#card)" stroke="#e5e7eb"/>
    <rect x="820" y="150" width="340" height="110" rx="20" fill="url(#card)" stroke="#e5e7eb"/>
    <rect x="1190" y="150" width="340" height="110" rx="20" fill="url(#card)" stroke="#e5e7eb"/>
  </g>

  <text x="110" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">PRESENCE RATE</text>
  <text x="110" y="230" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0f172a">100%</text>

  <text x="480" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">RANK</text>
  <text x="480" y="230" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0f172a">#1</text>

  <text x="850" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">TOP SOURCE</text>
  <text x="850" y="230" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#0f172a">forbes.com</text>

  <text x="1220" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" letter-spacing="1">TOP COMPETITOR</text>
  <text x="1220" y="230" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Pipedrive</text>

  <!-- Three Column Cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="300" width="480" height="520" rx="22" fill="url(#card)" stroke="#e5e7eb"/>
    <rect x="590" y="300" width="480" height="520" rx="22" fill="url(#card)" stroke="#e5e7eb"/>
    <rect x="1100" y="300" width="420" height="520" rx="22" fill="url(#card)" stroke="#e5e7eb"/>
  </g>

  <text x="110" y="345" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">LANDSCAPE</text>
  <text x="110" y="372" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0f172a">Competitors</text>

  <text x="620" y="345" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">SOURCES</text>
  <text x="620" y="372" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0f172a">Top Sources</text>

  <text x="1130" y="345" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">PERCEPTION</text>
  <text x="1130" y="372" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#0f172a">AI Perception</text>

  <!-- Rows in Top Sources -->
  <rect x="620" y="410" width="420" height="70" rx="16" fill="#ffffff" stroke="#eef2f7"/>
  <rect x="620" y="490" width="420" height="70" rx="16" fill="#ffffff" stroke="#eef2f7"/>
  <rect x="620" y="570" width="420" height="70" rx="16" fill="#ffffff" stroke="#eef2f7"/>

  <text x="650" y="448" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">forbes.com</text>
  <rect x="930" y="440" width="90" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="930" y="440" width="60" height="6" rx="3" fill="url(#bar)"/>

  <text x="650" y="528" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">techradar.com</text>
  <rect x="930" y="520" width="90" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="930" y="520" width="50" height="6" rx="3" fill="url(#bar)"/>

  <text x="650" y="608" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">reddit.com</text>
  <rect x="930" y="600" width="90" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="930" y="600" width="45" height="6" rx="3" fill="url(#bar)"/>

  <!-- Perception Pills -->
  <rect x="1130" y="420" width="360" height="70" rx="16" fill="#ffffff" stroke="#eef2f7"/>
  <text x="1155" y="455" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="0.6">BEST KNOWN FOR</text>
  <text x="1155" y="477" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Free, scalable CRM for startups</text>

  <rect x="1130" y="510" width="130" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="1270" y="510" width="150" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="1130" y="550" width="200" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
</svg>
