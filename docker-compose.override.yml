# Local development overrides
# This file is automatically merged with docker-compose.yml when running docker compose locally
# It ensures local development builds from source instead of using pre-built images

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.agent

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
