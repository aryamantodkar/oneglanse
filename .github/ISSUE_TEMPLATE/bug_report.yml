name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/oneglanse/oneglanse/issues) before submitting a report.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app (UI / dashboard)
        - Agent / browser automation
        - Provider auth (pnpm auth)
        - Response analysis (LLM)
        - Self-host / Docker / VPS
        - Docs
        - Other
    validations:
      required: true

  - type: dropdown
    id: setup
    attributes:
      label: Setup mode
      options:
        - Local (pnpm local)
        - Self-host (VPS / Docker)
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options:
        - ChatGPT
        - Perplexity
        - Gemini
        - Claude
        - Google AI Overview
        - N/A
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or errors
      description: Remove API keys, tokens, session data, and personal information before posting. Set `DEBUG_ENABLED=true` in `.env` for verbose agent output.
      render: shell

  - type: input
    id: version
    attributes:
      label: OneGlanse version or commit
      placeholder: e.g. main @ a1b2c3d

  - type: input
    id: os
    attributes:
      label: OS + Node.js version
      placeholder: e.g. macOS 15.2, Node 22.3
