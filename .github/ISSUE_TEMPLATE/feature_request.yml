name: Feature Request
description: Suggest a new feature or improvement for OneGlanse
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/oneglanse/oneglanse/issues) before submitting a request.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and current limitation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches you thought about, or workarounds you're currently using?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Provider coverage (new AI product)
        - Response analysis / scoring
        - Scheduling / automation
        - Auth / session management
        - Dashboard / UI
        - Self-host / deployment
        - API / integrations
        - Docs
        - Other

  - type: dropdown
    id: willing
    attributes:
      label: Would you like to implement this?
      options:
        - "Yes, I'll open a PR"
        - "Maybe, I'd need some guidance"
        - "No, just the suggestion"
