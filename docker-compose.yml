services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: onescope-agent-api
    restart: unless-stopped
    env_file:
      - apps/agent/.env
    command: pnpm start:api

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: onescope-agent-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    shm_size: "1gb"
    command: pnpm start:worker
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onescopeAI
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - db
      - clickhouse
      - redis

    # Uncomment below for development (mounts local code, uses pnpm dev)
    environment:
      CI: "true"
    volumes:
      - .:/app
    command: >
      sh -c "
      pnpm install &&
      pnpm --filter @onescope/web dev -H 0.0.0.0
      "
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./packages/db/init-scripts:/docker-entrypoint-initdb.d

  # ClickHouse service
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    restart: always
    env_file: .env
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./packages/db/clickhouse-init/:/docker-entrypoint-initdb.d/

  migrate:
    image: onescopeai-web
    env_file: .env
    depends_on:
      - db
    command: >
      sh -c "
      pnpm install &&
      pnpm --filter @onescope/db db:migrate
      "
volumes:
  db_data:
  clickhouse_data:
  redis_data: