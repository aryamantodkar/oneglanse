services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onescopeAI
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - db
      - clickhouse

    # Uncomment below for development (mounts local code, uses pnpm dev)
    environment:
      CI: "true"
    volumes:
      - .:/app
    command: >
      sh -c "
      pnpm install &&
      pnpm --filter @onescope/web dev -H 0.0.0.0
      "
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  # ClickHouse service
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    restart: always
    env_file: .env
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init/:/docker-entrypoint-initdb.d/

  migrate:
    image: onescopeai-web
    env_file: .env
    depends_on:
      - db
    command: >
      sh -c "
      pnpm install &&
      pnpm --filter @onescope/db db:migrate
      "
volumes:
  db_data:
  clickhouse_data: