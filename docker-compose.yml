services:
  # ----------------------------
  # Agent API
  # ----------------------------
  agent-api:
    image: ghcr.io/aryamantodkar/onescope-agent:latest
    pull_policy: always
    container_name: onescope-agent-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3333"
    env_file:
      - apps/agent/.env
    environment:
      NODE_ENV: production
    volumes:
      - agent_storage:/storage
    depends_on:
      - redis
    command: pnpm start:api

  # ----------------------------
  # Agent Worker
  # ----------------------------
  agent-worker:
    image: ghcr.io/aryamantodkar/onescope-agent:latest
    pull_policy: always
    container_name: onescope-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - apps/agent/.env
    shm_size: "1gb"
    volumes:
      - agent_storage:/storage
    depends_on:
      redis:
        condition: service_started
    command: pnpm start:worker

  # ----------------------------
  # Redis
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ----------------------------
  # PostgreSQL (OFFICIAL IMAGE)
  # ----------------------------
  db:
    image: ghcr.io/aryamantodkar/onescope-postgres:latest
    container_name: postgres_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./packages/db/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------
  # ClickHouse
  # ----------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./packages/db/clickhouse-init:/docker-entrypoint-initdb.d

  # ----------------------------
  # Web App (Next.js / UI)
  # ----------------------------
  web:
    image: ghcr.io/aryamantodkar/onescope-web:latest
    pull_policy: always
    container_name: onescope-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      clickhouse:
        condition: service_started

  # ----------------------------
  # Database Migrations (ONE-SHOT)
  # ----------------------------
  migrate:
    image: ghcr.io/aryamantodkar/onescope-web:latest
    pull_policy: always
    container_name: onescope-migrate
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: >
      sh -lc '
        set -e;
        ROOT="";
        for d in /workspace /app; do
          if [ -f "$$d/package.json" ] && [ -d "$$d/packages/db" ]; then
            ROOT="$$d";
            break;
          fi;
        done;
        if [ -z "$$ROOT" ]; then
          echo "Unable to find monorepo root (/workspace or /app) with packages/db";
          ls -la /;
          exit 1;
        fi;
        echo "Running migrations from $$ROOT";
        cd "$$ROOT";
        pnpm --filter @onescope/db db:migrate
      '

# ----------------------------
# Volumes
# ----------------------------
volumes:
  db_data:
  clickhouse_data:
  redis_data:
  agent_storage:
